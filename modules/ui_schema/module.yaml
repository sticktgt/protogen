id: ui_schema
name: UI Schema
version: 0.4.5
frontend:
  base_path: modules/ui_schema
  pages:
  - id: main
    title: UI Schema
    path: index.html
    menu:
      show: true
      title: UI Schema
      icon: 🧩
      order: 30
    params:
    - workspace_id
    - preview_run_id
backend:
  router: backend.modules.ui_schema.api:router
  api_prefix: /api/ui-schema
workspace:
  folder: ui_schema
  init:
    files: modules/ui_schema/init
    python_hook: backend.modules.ui_schema.init_workspace:init_workspace
docs:
  api: modules/ui_schema/api.openapi.yaml
  interop: modules/ui_schema/interop.yaml
