openapi: "3.1.0"
info:
  title: "Demo Hello API"
  version: "0.1.0"
paths:
  /api/hello/message:
    get:
      summary: "Read workspace message"
      parameters:
        - name: "workspace_id"
          in: "query"
          required: true
          schema:
            type: "string"
      responses:
        "200":
          description: "Message payload"
    put:
      summary: "Write workspace message"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: "object"
              required: ["workspace_id", "message"]
              properties:
                workspace_id:
                  type: "string"
                message:
                  type: "string"
      responses:
        "200":
          description: "Updated message payload"
