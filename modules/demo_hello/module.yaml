  api_prefix: "/api/hello"

workspace:
  folder: "demo_hello"
  init:
    files: "modules/demo_hello/init"

docs:
  api: "modules/demo_hello/api.openapi.yaml"
  interop: "modules/demo_hello/interop.yaml"
