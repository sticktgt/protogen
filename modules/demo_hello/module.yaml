id: "demo_hello"
name: "Demo Hello"
version: "0.1.0"

frontend:
  base_path: "modules/demo_hello"
  pages:
    - id: "main"
      title: "Demo Hello"
      path: "index.html"
      menu:
        show: true
        title: "Demo Hello"
        icon: "✉"
        order: 10
      params:
        - "workspace_id"

backend:
