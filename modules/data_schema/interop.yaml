module: data_schema
version: 0.1.0

provides:
  data_schema_summary:
    api: GET /api/data-schema
    description: Aggregated logical data schema for a workspace.
  data_entities:
    api: GET /api/data-schema/entities
    description: Logical entities and their fields.
  data_relations:
    api: GET /api/data-schema/relations
    description: Logical relations between entities.
  requirements_data_result:
    api: GET /api/data-schema/agent-runs/{run_id}/requirements-data-result
    description: Per-requirement synchronization outcome and data traceability.
  applied_requirements_data_export:
    api: GET /api/data-schema/exports/requirements-data/{run_id}
    description: Persisted synchronization outcome for an applied run.

consumes:
  requirements:
    source_reference: data_schema/requirements_source.json
    source_type: workspace_file
    canonical_file_owner: external requirements module
    link_field: requirements[].id
  ui_schema:
    link_file: mappings/ui_data_links.json
    target_examples:
      - ui_element
      - page
  api_schema:
    link_file: mappings/api_data_links.json
    target_examples:
      - resource
      - operation
      - schema_field
  code:
    link_file: code_links.json
    status: planned
