id: "data_schema"
name: "Data Schema"
version: "0.1.0"

frontend:
  base_path: "modules/data_schema"
  pages:
    - id: "main"
      title: "Data Schema"
      path: "index.html"
      menu:
        show: true
        title: "Data Schema"
        icon: "🗄️"
        order: 40
      params:
