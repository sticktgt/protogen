  - id: file_upload
    scope: page
    kind: atomic
    icon: 📎
    label: file_upload
  - id: main_menu
    scope: app
    kind: group
    icon: 🧭
    label: main_menu
    root_allowed: true
    unique_root: true
    allowed_children:
    - menu_group
    - menu_item
  - id: menu_group
    scope: app
    kind: group
    icon: 📁
    label: menu_group
    allowed_children:
    - menu_item
  - id: menu_item
    scope: app
    kind: atomic
    icon: ➡️
    label: menu_item
    link_source: true
    allowed_children: []
agent:
  enabled: true
  validation_retries: 1
  execution:
    max_llm_calls: 16
    max_tool_calls: 32
    max_total_tokens: 2000000
    write_bundle_max_files: 8
    write_pages_max_files: 8
    max_duration_seconds: 1200
    recursion_limit: 160
    request_timeout_seconds: 300
    max_repeated_tool_calls: 3
  requirements:
    default_workspace_path: ""
    max_bytes: 10485760
  prompts:
    system: modules/ui_schema/agent/prompts/system.md
    run: modules/ui_schema/agent/prompts/run.md
    correction: modules/ui_schema/agent/prompts/correction.md
    connection_test: modules/ui_schema/agent/prompts/connection_test.md
  reference_files:
    AGENT_INSTRUCTIONS.md: modules/ui_schema/agent/AGENT_INSTRUCTIONS.md
    STORAGE.md: modules/ui_schema/docs/STORAGE.md
    config.yaml: modules/ui_schema/config.yaml
  llm:
    provider_map:
      openai: openai
      anthropic: anthropic
      gemini: google_genai
      openrouter: openrouter
      ollama: ollama
      ollama-cloud: openai
      lmstudio: openai
      opencode: openai
      openai-compatible: openai
    default_base_urls:
      ollama-cloud: https://ollama.com/v1
    append_v1_base_url_for:
    - ollama-cloud
    api_key_required_for:
    - openai
    - anthropic
    - gemini
    - openrouter
    - ollama-cloud
    placeholder_api_key_for:
    - ollama
    - lmstudio
    - opencode
    - openai-compatible
    openai_chat_completions_for:
    - ollama-cloud
    - lmstudio
    - opencode
    - openai-compatible
    max_retries: 2
    temperature: 0
    connection_test_expected: ui-schema-llm-ok
  snapshots:
    keep_last: 10
