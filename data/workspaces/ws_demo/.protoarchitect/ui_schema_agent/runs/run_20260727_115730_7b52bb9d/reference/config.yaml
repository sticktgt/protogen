  - id: list
    scope: page
    kind: group
    icon: ☰
    label: list
  - id: text
    scope: page
    kind: atomic
    icon: T
    label: text
  - id: image
    scope: page
    kind: atomic
    icon: 🖼️
    label: image
  - id: input
    scope: page
    kind: atomic
    icon: ⌨️
    label: input
  - id: textarea
    scope: page
    kind: atomic
    icon: ¶
    label: textarea
  - id: select
    scope: page
    kind: atomic
    icon: ▾
    label: select
  - id: checkbox
    scope: page
    kind: atomic
    icon: ☑
    label: checkbox
  - id: radio
    scope: page
    kind: atomic
    icon: ◉
    label: radio
  - id: button
    scope: page
    kind: atomic
    icon: 🔘
    label: button
    link_source: true
  - id: link
    scope: page
    kind: atomic
    icon: 🔗
    label: link
    link_source: true
  - id: table
    scope: page
    kind: group
    icon: ▤
    label: table
    allowed_children:
    - table_column
  - id: table_column
    scope: page
    kind: atomic
    icon: ▥
    label: table_column
  - id: badge
    scope: page
    kind: atomic
