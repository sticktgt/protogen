    kind: group
    icon: 📝
    label: form
  - id: filter_panel
    scope: page
    kind: group
    icon: 🔎
    label: filter_panel
  - id: toolbar
    scope: page
    kind: group
    icon: 🧰
    label: toolbar
  - id: details_panel
    scope: page
    kind: group
    icon: 📋
    label: details_panel
  - id: tabs
    scope: page
    kind: group
    icon: 🗂️
    label: tabs
  - id: modal
    scope: page
    kind: group
    icon: ◫
    label: modal
  - id: wizard
    scope: page
    kind: group
