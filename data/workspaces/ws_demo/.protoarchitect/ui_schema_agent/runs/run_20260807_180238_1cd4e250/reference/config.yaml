ui:
  default_view: map
  element_types:
  - id: section
    scope: page
    kind: group
    icon: ▦
    label: section
  - id: form
    scope: page
    kind: group
    review_empty: true
    icon: 📝
    label: form
  - id: filter_panel
    scope: page
    kind: group
    icon: 🔎
    label: filter_panel
  - id: toolbar
    scope: page
    kind: group
    icon: 🧰
    label: toolbar
  - id: details_panel
    scope: page
    kind: group
    icon: 📋
    label: details_panel
  - id: tabs
    scope: page
    kind: group
    icon: 🗂️
    label: tabs
  - id: modal
    scope: page
    kind: group
    review_empty: true
    icon: ◫
    label: modal
  - id: wizard
    scope: page
    kind: group
    review_empty: true
    icon: 🪄
    label: wizard
  - id: grid
    scope: page
    kind: group
    icon: ▦
    label: grid
  - id: table_with_actions
    scope: page
    kind: group
    review_empty: true
    icon: 📊
    label: table_with_actions
  - id: card
    scope: page
    kind: group
    icon: ▣
    label: card
    link_source: true
  - id: list
    scope: page
    kind: group
    review_empty: true
    icon: ☰
    label: list
  - id: text
    scope: page
    kind: atomic
    icon: T
    label: text
  - id: image
    scope: page
    kind: atomic
    icon: 🖼️
    label: image
  - id: input
    scope: page
    kind: atomic
    icon: ⌨️
    label: input
  - id: textarea
    scope: page
    kind: atomic
    icon: ¶
    label: textarea
  - id: select
    scope: page
    kind: atomic
    icon: ▾
    label: select
  - id: checkbox
    scope: page
    kind: atomic
    icon: ☑
    label: checkbox
  - id: radio
    scope: page
    kind: atomic
    icon: ◉
    label: radio
  - id: button
    scope: page
    kind: atomic
    icon: 🔘
    label: button
    link_source: true
  - id: link
    scope: page
    kind: atomic
    icon: 🔗
    label: link
    link_source: true
  - id: table
    scope: page
    kind: group
    review_empty: true
    icon: ▤
    label: table
    allowed_children:
    - table_column
    - button
    - link
  - id: table_column
    scope: page
    kind: atomic
    root_allowed: false
    allowed_parents:
    - table
    - table_with_actions
    icon: ▥
    label: table_column
    link_source: true
  - id: badge
    scope: page
    kind: atomic
    icon: 🏷️
    label: badge
  - id: date_picker
    scope: page
    kind: atomic
    icon: 📅
    label: date_picker
  - id: file_upload
    scope: page
    kind: atomic
    icon: 📎
    label: file_upload
  - id: app_text
    scope: app
    kind: atomic
    icon: T
    label: app_text
    allowed_children: []
  - id: app_action
    scope: app
    kind: atomic
    icon: ↗
    label: app_action
    link_source: true
    allowed_children: []
  - id: main_menu
    scope: app
    kind: group
    icon: 🧭
    label: main_menu
    root_allowed: true
    unique_root: true
    allowed_children:
    - menu_group
    - menu_item
  - id: top_bar
    scope: app
    kind: group
    icon: ▔
    label: top_bar
    root_allowed: true
    unique_root: true
    allowed_children:
    - menu_group
    - menu_item
    - app_text
    - app_action
  - id: menu_group
    scope: app
    kind: group
    icon: 📁
    label: menu_group
    allowed_children:
    - menu_item
  - id: menu_item
    scope: app
    kind: atomic
    icon: ➡️
    label: menu_item
    link_source: true
    allowed_children: []
agent:
  enabled: true
  execution:
    max_llm_calls: 32
    max_tool_calls: 48
    max_total_tokens: 1000000
    write_page_max_top_level_elements: 32
    write_element_batch_max_changes: 120
    apply_change_bundle_max_pages: 8
    apply_change_bundle_max_moves: 40
    apply_change_bundle_max_links: 120
    apply_change_bundle_max_removals: 30
    max_duration_seconds: 1800
    recursion_limit: 120
    request_timeout_seconds: 300
    max_repeated_tool_calls: 3
  context:
    requirement_fields:
    - id
    - name
    - description
    - acceptanceCriteria
  requirements:
    default_workspace_path: ''
    max_bytes: 10485760
  manual_review:
    cleanup_candidates:
      enabled: false
      max_candidates: 5
      response_attempts: 2
      max_context_bytes: 524288
  diagnostics:
    validation_history:
      enabled: true
      max_entries: 64
      max_error_length: 1200
      max_errors_per_entry: 100
      max_repair_hints_per_entry: 100
    tool_trace:
      enabled: true
      max_entries: 256
      max_error_length: 600
    source_fingerprints:
      enabled: true
      include_git_commit: true
      build_id_environment:
      - PROTOARCHITECT_BUILD_ID
      - BUILD_ID
      commit_id_environment:
      - GIT_COMMIT
      - CI_COMMIT_SHA
  prompts:
    pipeline_analysis: modules/ui_schema/agent/prompts/pipeline_analysis.md
    pipeline_planning: modules/ui_schema/agent/prompts/pipeline_planning.md
    pipeline_repair: modules/ui_schema/agent/prompts/pipeline_repair.md
    pipeline_audit: modules/ui_schema/agent/prompts/pipeline_audit.md
    pipeline_correction: modules/ui_schema/agent/prompts/pipeline_correction.md
    pipeline_structural_review: modules/ui_schema/agent/prompts/pipeline_structural_review.md
    pipeline_output_contract: modules/ui_schema/agent/prompts/pipeline_output_contract.md
    pipeline_change_rules: modules/ui_schema/agent/prompts/pipeline_change_rules.md
    connection_test: modules/ui_schema/agent/prompts/connection_test.md
  reference_files:
    AGENT_INSTRUCTIONS.md: modules/ui_schema/agent/AGENT_INSTRUCTIONS.md
    STORAGE.md: modules/ui_schema/docs/STORAGE.md
    config.yaml: modules/ui_schema/config.yaml
  llm:
    provider_map:
      openai: openai
      anthropic: anthropic
      gemini: google_genai
      openrouter: openrouter
      ollama: ollama
      ollama-cloud: openai
      lmstudio: openai
      opencode: openai
      openai-compatible: openai
    default_base_urls:
      ollama-cloud: https://ollama.com/v1
    append_v1_base_url_for:
    - ollama-cloud
    api_key_required_for:
    - openai
    - anthropic
    - gemini
    - openrouter
    - ollama-cloud
    placeholder_api_key_for:
    - ollama
    - lmstudio
    - opencode
    - openai-compatible
    openai_chat_completions_for:
    - ollama-cloud
    - lmstudio
    - opencode
    - openai-compatible
    max_retries: 2
    temperature: 0
    connection_test_expected: ui-schema-llm-ok
  snapshots:
    keep_last: 10
  pipeline:
    analysis_batch_size: 24
    planning_batch_size: 12
    audit_batch_size: 40
    correction_batch_size: 12
    stage_attempts: 3
    apply_repair_attempts: 3
    validation_repair_attempts: 1
    correction_rounds: 1
    structural_review_candidate_limit: 24
    output_contract_prompt: pipeline_output_contract
    change_rules_prompt: pipeline_change_rules
    tool_choice: required
    stages:
      analysis:
        prompt: pipeline_analysis
        tool_name: submit_requirement_analysis
      planning:
        prompt: pipeline_planning
        tool_name: submit_ui_schema_plan
      repair:
        prompt: pipeline_repair
        tool_name: submit_repaired_ui_schema_plan
      audit:
        prompt: pipeline_audit
        tool_name: submit_ui_schema_audit
      correction:
        prompt: pipeline_correction
        tool_name: submit_ui_schema_correction
      structural_review:
        prompt: pipeline_structural_review
        tool_name: submit_ui_schema_structural_review
