logical_types: &logical_types
  - string
  - text
  - integer
  - decimal
  - boolean
  - date
  - datetime
  - uuid
  - dictionary
  - json

cardinalities: &cardinalities
  - one_to_one
  - one_to_many
  - many_to_one
  - many_to_many

agent:
  enabled: true
  worker_pool_size: 2
  domain:
    logical_types: *logical_types
    cardinalities: *cardinalities
  ui:
    poll_interval_ms: 2000
    event_page_size: 200
    event_buffer_size: 300
    event_display_limit: 100
    idle_warning_seconds: 120
  validation_retries: 1
  semantic_review:
    enabled: true
    max_correction_rounds: 3
    response_attempts: 2
    max_issues: 5
    max_context_bytes: 1048576
  execution:
    max_llm_calls: 18
    max_tool_calls: 28
    max_total_tokens: 600000
    max_duration_seconds: 1200
    recursion_limit: 80
    request_timeout_seconds: 300
    max_repeated_tool_calls: 3
  requirements:
    default_workspace_path: "requirements/requirements.json"
    max_bytes: 10485760
  prompts:
    system: modules/data_schema/agent/prompts/system.md
    run: modules/data_schema/agent/prompts/run.md
    correction: modules/data_schema/agent/prompts/correction.md
    semantic_review_system: modules/data_schema/agent/prompts/semantic_review_system.md
    semantic_coverage_review: modules/data_schema/agent/prompts/semantic_coverage_review.md
    semantic_consistency_review: modules/data_schema/agent/prompts/semantic_consistency_review.md
    semantic_verification: modules/data_schema/agent/prompts/semantic_verification.md
    semantic_correction: modules/data_schema/agent/prompts/semantic_correction.md
    semantic_correction_system: modules/data_schema/agent/prompts/semantic_correction_system.md
    connection_test: modules/data_schema/agent/prompts/connection_test.md
  reference_files:
    AGENT_INSTRUCTIONS.md: modules/data_schema/agent/AGENT_INSTRUCTIONS.md
    STORAGE.md: modules/data_schema/docs/STORAGE.md
    config.yaml: modules/data_schema/config.yaml
  llm:
    provider_map:
      openai: openai
      anthropic: anthropic
      gemini: google_genai
      openrouter: openrouter
      ollama: ollama
      ollama-cloud: openai
      lmstudio: openai
      opencode: openai
      openai-compatible: openai
    default_base_urls:
      ollama-cloud: https://ollama.com/v1
    append_v1_base_url_for:
      - ollama-cloud
    api_key_required_for:
      - openai
      - anthropic
      - gemini
      - openrouter
      - ollama-cloud
    placeholder_api_key_for:
      - ollama
      - lmstudio
      - opencode
      - openai-compatible
    openai_chat_completions_for:
      - ollama-cloud
      - lmstudio
      - opencode
      - openai-compatible
    disable_parallel_tool_calls_for:
      - openai
      - anthropic
      - openrouter
      - ollama-cloud
      - lmstudio
      - opencode
      - openai-compatible
    max_retries: 0
    reasoning_effort:
      ollama-cloud:
        generation: none
        correction: none
        review: low
        connection: none
    reasoning_effort_by_model:
      ollama-cloud:
        "qwen3.5:397b":
          generation: low
    temperature: 0
    connection_test_expected: data-schema-llm-ok
  snapshots:
    keep_last: 10
  retention:
    completed_event_limit: 300
