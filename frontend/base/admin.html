<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Администрирование</title>

  <link rel="stylesheet" href="/base/css/tokens.css">
  <link rel="stylesheet" href="/base/css/layout.css">
  <link rel="stylesheet" href="/base/css/components.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="sidebar-title">Модули</div>
      <nav class="sidebar-nav" data-sidebar></nav>
    </aside>
    <main class="main-panel">
      <header class="topbar" data-topbar></header>
      <section class="content">
        <div class="page-header">
          <h1 class="page-title">Администрирование</h1>
          <p class="page-subtitle">Минимальный системный раздел для общих настроек и пользователей.</p>
        </div>
        <div class="grid grid-2">
          <div class="card">
            <div class="card-title">Пользователи</div>
            <div class="grid" data-users></div>
            <hr>
            <form data-create-user>
              <div class="form-row">
                <label>username</label>
                <input name="username" required>
              </div>
              <div class="form-row">
                <label>display name</label>
                <input name="display_name">
              </div>
              <div class="form-row">
                <label>password</label>
                <input name="password" type="password" required>
              </div>
              <label><input name="is_admin" type="checkbox"> системный пользователь</label>
              <div style="margin-top: 12px;">
                <button class="btn btn-primary" type="submit">Добавить пользователя</button>
              </div>
            </form>
          </div>
          <div class="card">
            <div class="card-title">config/app.yaml</div>
            <p class="muted">Файл сохраняется без сложной валидации. Изменения startup-настроек требуют перезапуска.</p>
            <form data-app-config-form>
              <div class="form-row">
                <label>YAML как JSON-подобная структура</label>
                <textarea data-app-config style="min-height: 420px;"></textarea>
              </div>
              <button class="btn btn-primary" type="submit">Сохранить app config</button>
            </form>
          </div>
        </div>
      </section>
    </main>
  </div>
  <script type="module" src="/base/js/admin-page.js"></script>
</body>
</html>
